<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Matematika</title>
</head>
<body>
    <script>
        // 1️⃣ Operator Aritmatika
        document.writeln("Operator Aritmatika")
            // (+) Pertambahan
            let result = 1 + 2;
            document.writeln("<p>1 + 2 = " + result + "</p>"); // menuliskan variabel didalam/diantara string (petik) dinamakan String Concatenation (cara lama)
            let originalResult = result;

            // (-) Pengurangan
            result = result - 2;
            document.writeln(`${originalResult} - 2 = ${result} </p>`) // menuliskan variabel didalam/diantara backtick (``) dinamakan Template Literal (cara baru ES6) 
            originalResult = result;

            // (*) Perkalian
            result = result * 2;
            document.writeln(`${originalResult} * 2 = ${result} </p>`);
            originalResult = result;

            // (**) Pangkat
            result = result**3;
            document.writeln(`${originalResult} <sup> 3 </sup> = ${result} </p>`);
            originalResult = result;

            // (/) Pembagian
            result = result / 2;
            document.writeln(`${originalResult} / 2 = ${result} </p>`);
            originalResult = result;

            // (%) Modulo/Sisa Bagi
            result = result % 3;
            document.writeln(`${originalResult} % 3 = ${result} </p>`);
            originalResult = result;

            document.writeln("<hr>");

        // 2️⃣ Operator Augmented Assignments
        /*
        Jalan pintas buat nge-update isi variabel pakai nilainya sendiri.
        Contoh: 
        ◉ x += 5 (sama aja kaya x = x + 5) 
        ◉ let namaFile = "Surat_Laporan";
        namaFile += "_Final"; (Output: Surat_Laporan_Final)
        */
        document.writeln("Operator Augmented Assignments </p>")
            // (+=)
            result += 10;
            document.writeln(`${originalResult} + 10 = ${result} </p>`);
            originalResult = result;

            // (-=)
            result -= 10;
            document.writeln(`${originalResult} - 10 = ${result} </p>`);
            originalResult = result;

            // (*=)
            result *= 10;
            document.writeln(`${originalResult} * 10 = ${result} </p>`);
            originalResult = result;

            // (**=)
            result **= 2;
            document.writeln(`${originalResult} <sup> 2 </sup> = ${result} </p>`);
            originalResult = result;

            // (/=)
            result /= 2;
            document.writeln(`${originalResult} / 2 = ${result} </p>`);
            originalResult = result;

            // (%=)
            result %= 2;
            document.writeln(`${originalResult} % 2 = ${result} </p>`);
            originalResult = result;

            document.writeln("<hr>");

        // 3️⃣ Operator Unary
        document.writeln("Operator Augmented Assignments </p>")
            result = +1;
            originalResult = result

            // (-) Nilai Negatif
            result = -result;
            document.writeln(`${originalResult} = ${result} </p>`);
            originalResult = result;

            // (+) Menyulap teks menjadi angka murni
            let mieGacoan = "20";
            result = +mieGacoan + originalResult
            document.writeln(`${originalResult} + 20 = ${result} </p>`);
            originalResult = result;

            // (++) Seperti menambah +1
            result++;
            document.writeln(`${originalResult}++ = ${result} </p>`);
            originalResult = result;

            // (--) Seperti mengurangi -1
            result--;
            document.writeln(`${originalResult}-- = ${result} </p>`);
            originalResult = result;
</script>
</body>
</html>
