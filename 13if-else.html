<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Else</title>
</head>
<body>
    <script>
        /*
        Percabangan artinya kita bisa mengeksekusi kode program tertentu ketika suatu kondisi terpenuhi.
        Kapan menggunakan = dan ()
        🔹Tanda Sama dengan (=), digunakan ketika ingin memberikan/mengisi/menimpa sebuah variable/wadah kosong.
        🔹Tanda Kurung (), digunakan ketika ingin menyuruh/memerintah komputer dalam suatu tindakan.
        */

        const btn = document.createElement("button");
        btn.innerHTML = "Unggah";
        btn.setAttribute("id", "btn-upload");
        document.body.appendChild(btn);
        document.writeln(`</p>`);

        // 1️⃣ if (satu kondisi khusus)
        let unggahButton = document.getElementById("btn-upload");
        if (unggahButton !== null) {
            document.writeln(`Tombol ditemukan. Mengklik tombol unggah otomatis...`);
            unggahButton.click();
        }
        document.writeln(`</p>`);
        // Jika tombolnya belum muncul (null), script tidak melakukan apa-apa
        document.writeln(`Melanjutkan pemindaian halaman...`);

        document.writeln(`</p>`);

        let fileName = "Laporan_Kinerja_Bulan_Mei.pdf"
        let statusTtd = false;
        // 2️⃣ if else (dua kondisi khusus)
        if(statusTtd === true) {
            document.writeln(`[SUKSES] Dokumen ${fileName} valid. Memasukkan ke database SIKN...`);
        } else {
            document.writeln(`[TOLAK] Dokumen ${fileName} belum di-TTD. Dikembalikan ke folder Draft.`);
        }

        document.writeln(`</p>`);

        // 3️⃣ else if (lebih dari dua kemungkinan)
        fileName = "RAHASIA_Data_Pegawai_Kemnaker.pdf";
        let accessibility = "";

        if (fileName.includes("SANGAT_RAHASIA")) {
            accessibility = "Level 1 - Hanya Pimpinan";
            document.writeln(`PERHATIAN: Mengunci dokumen untuk Level 1.`);
        } else if (fileName.includes("RAHASIA")) {
            accessibility = "Level 2 - Internal Instansi";
            document.writeln(`Memproses dokumen dengan akses Level 2.`);
        } else if (fileName.includes("PENTING")) {
            accessibility = "Level 3 - Antar Divisi";
            document.writeln(`Memproses dokumen dengan akses Level 3.`);
        } else {
            accessibility = "Level 1 - Publik";
            document.writeln(`Dokumen diklasifikasikan sebagai dokumen Publik.`);
        }

        document.writeln(`</p>`);

        // 🟠 Truthy & Falsy
        // Setiap nilai (tipe data apa pun) secara diam-diam memiliki "jiwa" true atau false.
        // 🔹 Falsy
        /*
        Hanya ada 6 nilai di JavaScript yang dianggap false.
        Jika ada salah satu dari 6 nilai falsy ada di percabangan,
        maka akan langsung di lempar ke else.
        false, Angka 0, String kosong tanpa spasi, null, undefined, NaN.
        */
        fileName = "";
        if (fileName) { // Langsung sebut nama variabel yang jadi kondisi di percabangan ini.
            // Semua nilai otomatis true, kecuali 6 nilai yang disebut sebelumnya.
            document.writeln(`Nama file aman, lanjut proses. Truthy`);
        } else {
            document.writeln(`Error: Nama file tidak boleh kosong. Falsy`);
        }

    </script>
</body>
</html>
